<div class="user-management-container">
  <div class="management-header">
    <button class="back-btn" (click)="goBack()">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 12H5M12 19L5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      返回儀表板
    </button>
    <h1 class="management-title">使用者管理</h1>
    <div class="user-badge">
      <span class="user-name">{{ currentUser?.name }}</span>
      <span class="user-role">管理者</span>
    </div>
  </div>

  <div class="management-content">
    <!-- 新增使用者區塊 -->
    <div class="management-section">
      <div class="section-header">
        <h2>新增使用者</h2>
        <p>建立新的使用者帳號</p>
      </div>
      
      <form class="management-form" (ngSubmit)="create()" #f="ngForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="username">帳號</label>
            <input 
              type="text" 
              id="username"
              name="username" 
              [(ngModel)]="form.username" 
              placeholder="請輸入使用者帳號"
              required>
          </div>

          <div class="form-group">
            <label for="password">密碼</label>
            <input 
              type="password" 
              id="password"
              name="password" 
              [(ngModel)]="form.password" 
              placeholder="請輸入密碼（至少6個字元）"
              required>
          </div>

          <div class="form-group">
            <label for="company_name">公司</label>
            <input 
              type="text" 
              id="company_name"
              name="company_name" 
              [(ngModel)]="form.company_name" 
              placeholder="請輸入公司名稱">
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input 
              type="email" 
              id="email"
              name="email" 
              [(ngModel)]="form.email" 
              placeholder="請輸入電子郵件">
          </div>

          <div class="form-group">
            <label for="role">角色</label>
            <select id="role" name="role" [(ngModel)]="form.role">
              <option value="user">一般使用者</option>
              <option value="reviewer">審核者</option>
              <option value="admin">管理者</option>
              <option value="sudo">超級管理者</option>
            </select>
          </div>
        </div>

        <button 
          type="submit" 
          class="submit-btn"
          [disabled]="!f.form.valid">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          新增使用者
        </button>
      </form>
    </div>

    <!-- 使用者列表區塊 -->
    <div class="management-section">
      <div class="section-header">
        <div>
          <h2>使用者列表</h2>
          <p>管理現有使用者帳號</p>
        </div>
        <button class="refresh-btn" (click)="refresh()">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 4V10H7M23 20V14H17M20.49 9C19.9828 7.56678 19.1209 6.28537 17.9845 5.27535C16.8482 4.26534 15.4745 3.55992 13.9917 3.22427C12.5089 2.88862 10.9652 2.92887 9.5 3.34176C8.03477 3.75465 6.69475 4.52759 5.59 5.59L1 10M23 14L18.41 18.41C17.3053 19.4724 15.9652 20.2454 14.5 20.6582C13.0348 21.0711 11.4911 21.1114 10.0083 20.7757C8.52547 20.4401 7.1518 19.7347 6.01547 18.7246C4.87913 17.7146 4.01717 16.4332 3.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          重新整理
        </button>
      </div>

      <div class="table-container">
        <table class="users-table" *ngIf="users.length > 0; else noUsers">
          <thead>
            <tr>
              <th>ID</th>
              <th>公司</th>
              <th>帳號</th>
              <th>Email</th>
              <th>角色</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let u of users">
              <td>{{ u.id }}</td>
              <td>{{ u.company_name || '未設定' }}</td>
              <td>{{ u.username }}</td>
              <td>{{ u.email || '未設定' }}</td>
              <td>
                <select [(ngModel)]="u.role" class="role-select">
                  <option value="user">一般使用者</option>
                  <option value="reviewer">審核者</option>
                  <option value="admin">管理者</option>
                  <option value="sudo">超級管理者</option>
                </select>
              </td>
              <td class="action-cell">
                <button class="save-btn" (click)="save(u)">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H16L21 8V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M17 21V13H7V21M7 3V8H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  儲存
                </button>
                <button class="reset-btn" (click)="openResetPasswordModal(u)">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M19.4 15C19.2669 15.3016 19.2272 15.6362 19.286 15.9606C19.3448 16.285 19.4995 16.5843 19.73 16.82L19.79 16.88C19.976 17.0657 20.1235 17.2863 20.2241 17.5291C20.3248 17.7719 20.3766 18.0322 20.3766 18.295C20.3766 18.5578 20.3248 18.8181 20.2241 19.0609C20.1235 19.3037 19.976 19.5243 19.79 19.71C19.6043 19.896 19.3837 20.0435 19.1409 20.1441C18.8981 20.2448 18.6378 20.2966 18.375 20.2966C18.1122 20.2966 17.8519 20.2448 17.6091 20.1441C17.3663 20.0435 17.1457 19.896 16.96 19.71L16.9 19.65C16.6643 19.4195 16.365 19.2648 16.0406 19.206C15.7162 19.1472 15.3816 19.1869 15.08 19.32C14.7842 19.4468 14.532 19.6572 14.3543 19.9255C14.1766 20.1938 14.0813 20.5082 14.08 20.83V21C14.08 21.5304 13.8693 22.0391 13.4942 22.4142C13.1191 22.7893 12.6104 23 12.08 23C11.5496 23 11.0409 22.7893 10.6658 22.4142C10.2907 22.0391 10.08 21.5304 10.08 21V20.91C10.0723 20.579 9.96512 20.2579 9.77251 19.9887C9.5799 19.7194 9.31074 19.5143 9 19.4C8.69838 19.2669 8.36381 19.2272 8.03941 19.286C7.71502 19.3448 7.41568 19.4995 7.18 19.73L7.12 19.79C6.93425 19.976 6.71368 20.1235 6.47088 20.2241C6.22808 20.3248 5.96783 20.3766 5.705 20.3766C5.44217 20.3766 5.18192 20.3248 4.93912 20.2241C4.69632 20.1235 4.47575 19.976 4.29 19.79C4.10405 19.6043 3.95653 19.3837 3.85588 19.1409C3.75523 18.8981 3.70343 18.6378 3.70343 18.375C3.70343 18.1122 3.75523 17.8519 3.85588 17.6091C3.95653 17.3663 4.10405 17.1457 4.29 16.96L4.35 16.9C4.58054 16.6643 4.73519 16.365 4.794 16.0406C4.85282 15.7162 4.81312 15.3816 4.68 15.08C4.55324 14.7842 4.34276 14.532 4.07447 14.3543C3.80618 14.1766 3.49179 14.0813 3.17 14.08H3C2.46957 14.08 1.96086 13.8693 1.58579 13.4942C1.21071 13.1191 1 12.6104 1 12.08C1 11.5496 1.21071 11.0409 1.58579 10.6658C1.96086 10.2907 2.46957 10.08 3 10.08H3.09C3.42099 10.0723 3.742 9.96512 4.01127 9.77251C4.28054 9.5799 4.48571 9.31074 4.6 9C4.73312 8.69838 4.77282 8.36381 4.714 8.03941C4.65519 7.71502 4.50054 7.41568 4.27 7.18L4.21 7.12C4.02405 6.93425 3.87653 6.71368 3.                   </svg>
                  重設密碼
                </button>
                <button class="delete-btn" (click)="remove(u)">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 6H5H21M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  刪除
                </button>
              </td>
            </tr>
          </tbody>
        </table>
        <ng-template #noUsers>
          <div class="no-users">
            <div class="empty-icon">👥</div>
            <h4>尚無使用者</h4>
            <p>開始新增第一個使用者吧！</p>
          </div>
        </ng-template>
      </div>
    </div>
  </div>

  <!-- 重設密碼模態框 -->
  <div class="modal-overlay" *ngIf="showResetPasswordModal" (click)="closeResetPasswordModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>重設使用者密碼</h3>
        <button class="modal-close" (click)="closeResetPasswordModal()">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      
      <div class="modal-body">
        <div class="user-info-box">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 21V19C20 17.9391 19.5786 16.9217 18.8284 16.1716C18.0783 15.4214 17.0609 15 16 15H8C6.93913 15 5.92178 15.4214 5.17163 16.1716C4.42149 16.9217 4 17.9391 4 19V21M16 7C16 9.20914 14.2091 11 12 11C9.79086 11 8 9.20914 8 7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>正在為 <strong>{{ getUsernameById(resetPasswordUserId!) }}</strong> 重設密碼</span>
        </div>

        <form class="reset-form" (ngSubmit)="resetPassword()" #resetForm="ngForm">
          <div class="form-group">
            <label for="newPassword">新密碼</label>
            <input 
              type="password" 
              id="newPassword"
              name="newPassword" 
              [(ngModel)]="resetPasswordForm.newPassword" 
              placeholder="請輸入新密碼（至少6個字元）"
              required
              minlength="6">
          </div>

          <div class="form-group">
            <label for="confirmPassword">確認新密碼</label>
            <input 
              type="password" 
              id="confirmPassword"
              name="confirmPassword" 
              [(ngModel)]="resetPasswordForm.confirmPassword" 
              placeholder="請再次輸入新密碼"
              required
              minlength="6">
          </div>

          <div class="modal-actions">
            <button type="button" class="cancel-btn" (click)="closeResetPasswordModal()">
              取消
            </button>
            <button 
              type="submit" 
              class="confirm-btn"
              [disabled]="!resetForm.form.valid">
              確認重設
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
